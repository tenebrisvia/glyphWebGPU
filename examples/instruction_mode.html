<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instruction mode example</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #050508;
            color: #e0e0e0;
            font-family: monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #infoPanel {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid #1f2d42;
            padding: 12px 18px;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
        }
        p {
            margin: 3px 0;
            font-size: 12px;
            color: #a0aec0;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid #1a2333;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
        }
    </style>
    <script src="../glyphWebGPU.js"></script>
</head>
<body>
    <div id="infoPanel">
        <p><span id="gridStats">...</span> | Updates per frame: <span id="updateCount">0</span></p>
    </div>

    <canvas id="asciiCanvas"></canvas>

    <script>
        "use strict";

        // Grid Configuration
        const glyphWidth = 8, glyphHeight = 8;
        const zoom = 2; // 2x zoom -> 16x16 rendered cell size
        const cellWidth = glyphWidth * zoom;
        const cellHeight = glyphHeight * zoom;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        let cols = Math.floor((window.innerWidth - 40) * dpr / cellWidth);
        let rows = Math.floor((window.innerHeight - 40) * dpr / cellHeight);

        const asciiCanvas = document.getElementById('asciiCanvas');
        asciiCanvas.width = cols * glyphWidth;
        asciiCanvas.height = rows * glyphHeight;
        asciiCanvas.style.width = `${(cols * cellWidth) / dpr}px`;
        asciiCanvas.style.height = `${(rows * cellHeight) / dpr}px`;

        document.getElementById('gridStats').textContent = `${cols} x ${rows} = ${cols * rows} cells`;

        let renderer = null;

        // Particle System for Sparse Updates
        const numParticles = 50;
        const particles = [];
        const chars = [33, 121,5, 36, 37, 38, 42, 43, 60, 62, 63, 64, 65, 66, 67, 68, 88, 89, 90, 126];

        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: Math.floor(Math.random() * cols),
                y: Math.floor(Math.random() * rows),
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                char: chars[Math.floor(Math.random() * chars.length)],
                hue: Math.random()
            });
        }

        // Pre-packed constant colors using GlyphWebGPU.packColor
        const BG_COLOR = GlyphWebGPU.packColor(0, 0, 0.3);
        const FG_WHITE = GlyphWebGPU.packColor(1, 1, 1);
        const FG_BLACK = GlyphWebGPU.packColor(0, 0, 0);

        // Fast HSL to pre-packed uint32 RGBA8 color helper
        function hslToPacked(h, s, l) {
            const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
            const p = 2 * l - q;
            const hue2rgb = (t) => {
                let tt = t;
                if (tt < 0) tt += 1;
                if (tt > 1) tt -= 1;
                if (tt < 1/6) return p + (q - p) * 6 * tt;
                if (tt < 1/2) return q;
                if (tt < 2/3) return p + (q - p) * (2/3 - tt) * 6;
                return p;
            };
            return GlyphWebGPU.packColor(
                hue2rgb(h + 1/3),
                hue2rgb(h),
                hue2rgb(h - 1/3)
            );
        }

        async function init() {
            // Instantiate GlyphWebGPU
            renderer = GlyphWebGPU.Instructions(asciiCanvas, cols, rows, 0.15 /* decay persistence */);

            // Load Font Atlas PNG
            await renderer.loadGlyphsURL(
                '../fonts/Amstrad_CPC_Full_AMSDOS_Character_Set.png',
                128, 128, // Atlas width & height
                glyphWidth, glyphHeight  
            );

            renderer.clear(32, FG_WHITE, BG_COLOR);

            requestAnimationFrame(renderLoop);
        }

        let frameCount = 0;

        function renderLoop() {
            if (!renderer) return;

            const instructions = [];

            // Update particle positions and send sparse instruction updates
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                // Clear previous position (restore dark background)
                const prevX = Math.floor(p.x);
                const prevY = Math.floor(p.y);

                p.x += p.vx;
                p.y += p.vy;

                // Bounce off boundaries
                if (p.x < 0 || p.x >= cols) { p.vx *= -1; p.x = Math.max(0, Math.min(cols - 1, p.x)); }
                if (p.y < 0 || p.y >= rows) { p.vy *= -1; p.y = Math.max(0, Math.min(rows - 1, p.y)); }

                const newX = Math.floor(p.x);
                const newY = Math.floor(p.y);

                // If position changed, clear old cell and write new cell
                if (prevX !== newX || prevY !== newY) {
                    instructions.push({
                        x: prevX,
                        y: prevY,
                        charCode: 32, // space
                        fg: FG_BLACK,
                        bg: BG_COLOR
                    });

                    // Dynamic color per particle
                    p.hue = (p.hue + 0.005) % 1.0;
                    const fg = hslToPacked(p.hue, 0.9, 0.65);
                    const bg = hslToPacked((p.hue + 0.5) % 1.0, 0.8, 0.1);

                    instructions.push({
                        x: newX,
                        y: newY,
                        charCode: p.char,
                        fg: fg,
                        bg: bg
                    });
                }
            }

            document.getElementById('updateCount').textContent = instructions.length;

            // Render frame passing the array of cumulative updates
            renderer.draw(instructions);

            frameCount++;
            requestAnimationFrame(renderLoop);
        }

        window.addEventListener('resize', () => {
            cols = Math.floor((window.innerWidth - 40) * dpr / cellWidth);
            rows = Math.floor((window.innerHeight - 40) * dpr / cellHeight);

            asciiCanvas.width = cols * glyphWidth;
            asciiCanvas.height = rows * glyphHeight;
            asciiCanvas.style.width = `${(cols * cellWidth) / dpr}px`;
            asciiCanvas.style.height = `${(rows * cellHeight) / dpr}px`;

            document.getElementById('gridStats').textContent = `${cols} x ${rows} (${cols * rows} cells)`;

            if (renderer) {
                renderer.resize(cols, rows);
                renderer.clear(32, FG_WHITE, BG_COLOR);
            }
        });

        init();
    </script>
</body>
</html>
