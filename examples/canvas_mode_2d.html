<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Canvas mode example</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }
        #sourceCanvas {
            display: none;
        }
    </style>
    <script src="../thirdparty/p5.min.js"></script>
    <script src="../glyphWebGPU.js"></script>
</head>
<body>
    <canvas id="sourceCanvas"></canvas>
    <canvas id="asciiCanvas"></canvas>
    <script>
        "use strict";

        // 1. Grid Configuration
        const glyphWidth = 8, glyphHeight = 8;
        const zoom = 2; // 2x zoom -> 8x8 glyph renders as 16x16
        const cellWidth = glyphWidth * zoom;
        const cellHeight = glyphHeight * zoom;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        let cols = Math.floor(window.innerWidth * dpr / cellWidth);
        let rows = Math.floor(window.innerHeight * dpr / cellHeight);

        const sourceCanvas = document.getElementById('sourceCanvas');
        const asciiCanvas = document.getElementById('asciiCanvas');

        asciiCanvas.width = cols * glyphWidth;
        asciiCanvas.height = rows * glyphHeight;
        asciiCanvas.style.width = `${(cols * cellWidth) / dpr}px`;
        asciiCanvas.style.height = `${(rows * cellHeight) / dpr}px`;

        let glyphRenderer = null;

        // 2. p5.js Setup Callback
        async function setup() {
            // Force 1:1 pixel density on source canvas (1 pixel per ASCII grid cell)
            pixelDensity(1);
            createCanvas(cols, rows, P2D, sourceCanvas);

            // Instantiate GlyphWebGPU engine
            glyphRenderer = new GlyphWebGPU(sourceCanvas, asciiCanvas, cols, rows, 0.0);

            // Define ASCII Character Map (256 entries mapping luminance 0..255 to character codes)
            const charMap = new Float32Array(256);
            const ramp = [32, 46, 58, 45, 61, 43, 42, 35, 37, 64];
            for (let i = 0; i < 256; i++) {
                const rampIdx = Math.floor((i / 256) * ramp.length);
                charMap[i] = ramp[rampIdx];
            }

            // Background
            const bgColors = new Float32Array(256 * 4);
            for (let i = 0; i < 256; i++) {
                bgColors[i * 4 + 0] = 0.0;
                bgColors[i * 4 + 1] = 0.0;
                bgColors[i * 4 + 2] = 0.0;
            }

            // Direct RGB Mode: pass null for fgColors so p5.js RGB colors directly colorize each glyph
            glyphRenderer.setPalettes(charMap, null, bgColors);

            // Load Font Atlas PNG
            await glyphRenderer.loadGlyphsURL(
                '../fonts/Amstrad_CPC_Full_AMSDOS_Character_Set.png',
                128, 128, // Atlas width & height
                glyphWidth, glyphHeight
            );
        }

        // 3. p5.js 2D Render Loop
        function draw() {
            // Draw animated 2D generative graphics on offscreen source canvas
            background(0);

            const t = millis() * 0.002;
            const centerX = cols / 2;
            const centerY = rows / 2;
            const maxRadius = Math.min(cols, rows) * 0.35;

            noStroke();

            // Render 3 orbiting circles with direct RGB colors
            const circleColors = [
                [255, 45, 45],   // Circle 1: Vivid Red
                [45, 255, 65],   // Circle 2: Vivid Green
                [45, 145, 255]   // Circle 3: Vivid Blue
            ];
            const numCircles = circleColors.length;

            for (let i = 0; i < numCircles; i++) {
                const angle = t * 1.1 + (i * (Math.PI * 2 / numCircles));
                const distance = (0.55 + Math.sin(t * 0.7 + i * 2) * 0.25) * maxRadius;
                const x = centerX + Math.cos(angle) * distance;
                const y = centerY + Math.sin(angle) * distance;
                const radius = 10 + Math.sin(t * 1.8 + i) * 4;
                const c = circleColors[i];
                
                fill(c[0], c[1], c[2]);
                ellipse(x, y, radius * 2, radius * 2);
            }

            // 4. Render WebGPU ASCII Frame
            if (glyphRenderer) {
                glyphRenderer.draw();
            }
        }

        // 4. Window Resize Handler
        function windowResized() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            cols = Math.floor(window.innerWidth * dpr / cellWidth);
            rows = Math.floor(window.innerHeight * dpr / cellHeight);

            asciiCanvas.width = cols * glyphWidth;
            asciiCanvas.height = rows * glyphHeight;
            asciiCanvas.style.width = `${(cols * cellWidth) / dpr}px`;
            asciiCanvas.style.height = `${(rows * cellHeight) / dpr}px`;

            resizeCanvas(cols, rows);
            if (glyphRenderer) {
                glyphRenderer.resize(cols, rows);
            }
        }
    </script>
</body>
</html>
